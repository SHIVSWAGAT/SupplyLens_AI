databases: []

services:
  - type: web
    name: supplylens-api
    runtime: python
    rootDir: SupplyLensAI
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./supplylens_dev.db
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: supplylens-frontend
    runtime: static
    rootDir: SupplyLensAI/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
